name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: higgsfield_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::run gofmt -w ."; exit 1; }

      - run: go vet ./...

      - name: Start MinIO
        # An S3-compatible server, so the object storage driver is exercised
        # against something that really signs and validates requests.
        run: |
          docker run -d --name minio -p 9100:9000 \
            -e MINIO_ROOT_USER=testkey -e MINIO_ROOT_PASSWORD=testsecret123 \
            quay.io/minio/minio:latest server /data
          for i in $(seq 1 20); do
            curl -sf http://localhost:9100/minio/health/live && break || sleep 2
          done

      - name: Test
        # The integration suites only run when these are set, so they exercise
        # real infrastructure here and stay skippable on a laptop.
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/higgsfield_test?sslmode=disable
          TEST_S3_ENDPOINT: http://localhost:9100
        run: go test -race ./...

      - run: go build ./...

      - name: Build the image Render will build
        # Render builds from this Dockerfile. Without this step a broken
        # Dockerfile is only discovered during a production deploy.
        run: docker build -f Dockerfile -t aperture-api:ci .

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx prettier --check .
      - run: npx tsc --noEmit
      - run: npx eslint .
      - name: Build
        # Auth0 config is read at request time, not build time; these only need
        # to be present and syntactically valid for the build to complete.
        env:
          AUTH0_DOMAIN: ci.example.auth0.com
          AUTH0_CLIENT_ID: ci
          AUTH0_CLIENT_SECRET: ci
          AUTH0_AUDIENCE: https://ci.example/api
          AUTH0_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          APP_BASE_URL: http://localhost:3000
        run: npm run build
