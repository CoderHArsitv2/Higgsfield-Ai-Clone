name: Deploy production

# Production is the only environment.
#
# Two ways in, and they never both fire for one push: a branch push does not
# match a tag filter and a tag push does not match a branch filter.
#
#   push to main  -> continuous deploy, version recorded as the short SHA
#   push a v* tag -> deploy stamped with that version, plus a GitHub Release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write # creating the release

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_release: ${{ steps.v.outputs.is_release }}
    steps:
      - id: v
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            version="main-$(echo "${GITHUB_SHA}" | cut -c1-7)"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Deploying version $version"


  gate:
    name: Test gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: higgsfield_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Agent logs intact
        run: ./scripts/verify-agent-logs.sh

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Backend vet and test
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/higgsfield_test?sslmode=disable
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend checks and build
        working-directory: frontend
        env:
          AUTH0_DOMAIN: ci.example.auth0.com
          AUTH0_CLIENT_ID: ci
          AUTH0_CLIENT_SECRET: ci
          AUTH0_AUDIENCE: https://ci.example/api
          AUTH0_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          APP_BASE_URL: http://localhost:3000
        run: |
          npm ci
          npx prettier --check .
          npx tsc --noEmit
          npx eslint .
          npm run build

  backend:
    name: Deploy backend (Render)
    needs: [version, gate]
    runs-on: ubuntu-latest
    environment: production
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Stamp the version on the service
        # Render builds the image itself, so the version cannot be baked in at
        # build time from here. Setting it as an env var before triggering the
        # deploy means the build that follows picks it up and reports it at
        # /health. A failure here is not fatal: the deploy is still correct,
        # only its label would be stale.
        continue-on-error: true
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/envvar.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"value\":\"$VERSION\"}" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/APP_VERSION")
          echo "Render responded $code"
          [ "$code" -lt 300 ] || { cat /tmp/envvar.json; echo "::warning::Could not set APP_VERSION"; }

      - name: Trigger deploy
        id: trigger
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          deploy_id=$(curl -sS -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            | jq -r '.id')
          if [ -z "$deploy_id" ] || [ "$deploy_id" = "null" ]; then
            echo "::error::Render did not return a deploy id"
            exit 1
          fi
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "Started Render deploy $deploy_id"

      - name: Wait for deploy to finish
        # A deploy hook that fires and forgets reports green even when the
        # deploy fails, so this polls until Render reaches a terminal state.
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            status=$(curl -sS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              | jq -r '.status')
            echo "[$i] status: $status"
            case "$status" in
              live) echo "Deploy succeeded"; exit 0 ;;
              build_failed|update_failed|canceled|pre_deploy_failed)
                echo "::error::Render deploy ended as $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for the Render deploy"
          exit 1

      - name: Health check
        # Checking only for status ok would pass against the instance that was
        # already running, so this waits until /health reports the version we
        # just deployed. That is the difference between "something answers" and
        # "the new build is live".
        env:
          BACKEND_URL: ${{ secrets.BACKEND_PUBLIC_URL }}
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            body=$(curl -fsS "$BACKEND_URL/health" || true)
            echo "[$i] $body"
            status=$(echo "$body" | jq -r '.status // empty')
            live=$(echo "$body" | jq -r '.version // empty')
            if [ "$status" = "ok" ] && [ "$live" = "$VERSION" ]; then
              echo "Backend healthy on $live"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Backend never reported version $VERSION"
          exit 1

  frontend:
    name: Deploy frontend (Vercel)
    needs: [version, gate]
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm install --global vercel@latest

      - name: Pull production config
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  release:
    name: Publish release
    needs: [version, backend, frontend]
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes are generated from history

      # Only after both deploys succeeded, so a release tag never points at
      # something that failed to reach production.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --verify-tag
