# Render blueprint. Production only -- there is no staging service by design.
services:
  - type: web
    name: aperture-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    # Repository root, so the build needs no context override configured by
    # hand. The Dockerfile's COPY paths are repo-relative to match.
    dockerContext: .
    region: oregon
    plan: starter
    healthCheckPath: /health
    autoDeploy: false # GitHub Actions owns deploys so they are gated on tests
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aperture-db
          property: connectionString
      # Set these in the Render dashboard; they are secrets.
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # Object storage. Without these, generated files land on the container
      # filesystem and are lost on every deploy.
      - key: STORAGE_BUCKET
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # Provider credentials. Each one unlocks its models for every user.
      - key: FAL_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false

databases:
  - name: aperture-db
    databaseName: aperture
    plan: basic-256mb
    region: oregon
