# Local Postgres only. The apps run on the host so hot reload works normally.
services:
  postgres:
    image: postgres:16-alpine
    container_name: aperture-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: higgsfield
    ports:
      - "5432:5432"
    volumes:
      - aperture-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aperture-pgdata:
